<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapstar Card Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0b1d3a; --blue:#1d6ff2; --ink:#14213d; --muted:#6b7a90; --line:#d8e0ec; --red:#e5384f; --green:#1fa971; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--navy); font-family:'Poppins',system-ui,sans-serif; color:var(--ink); }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
  .ring { width:44px; height:44px; border:3px solid #ffffff33; border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .modal { background:#fff; width:100%; max-width:380px; border-radius:16px; padding:20px; box-shadow:0 20px 50px #0008; display:none; }
  .head { display:flex; gap:12px; align-items:center; margin-bottom:16px; }
  .logo { width:38px; height:38px; border-radius:10px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:600; }
  .head h1 { font-size:17px; margin:0; font-weight:600; }
  .head p { margin:0; font-size:12px; color:var(--muted); }
  label { display:block; font-size:12px; font-weight:500; margin:12px 0 5px; }
  input[type=email],input[type=password],input[type=text],select {
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:14px; background:#fff; color:var(--ink);
  }
  input:focus,select:focus,button:focus-visible { outline:2px solid var(--blue); outline-offset:1px; }
  .scan { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding:10px 12px; background:#eef4ff; border-radius:10px; font-size:12px; }
  .scan b { display:block; font-size:13px; }
  .scan span { color:var(--muted); }
  .btn-small { border:0; background:var(--blue); color:#fff; padding:8px 12px; border-radius:8px; font:inherit; font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap; }
  #reader { margin-top:10px; border-radius:10px; overflow:hidden; display:none; }
  .terms { display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--muted); margin-top:14px; }
  .terms input { margin-top:2px; }
  .submit { width:100%; margin-top:16px; padding:13px; border:0; border-radius:10px; background:var(--blue); color:#fff; font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .submit:disabled { opacity:.6; }
  .done { text-align:center; padding:12px 0 4px; }
  .tick { width:56px; height:56px; border-radius:50%; background:#e3f6ee; color:var(--green); display:grid; place-items:center; font-size:28px; margin:0 auto 12px; }
  .done h2 { margin:0 0 6px; font-size:18px; }
  .done p { margin:0 0 16px; font-size:13px; color:var(--muted); }
  .done a { display:block; text-decoration:none; text-align:center; }
  .msg { color:#fff; text-align:center; font-size:14px; max-width:300px; }
  #toast { position:fixed; left:16px; right:16px; bottom:20px; max-width:380px; margin:0 auto; padding:12px 14px; border-radius:10px; color:#fff; font-size:13px; font-weight:500; text-align:center; display:none; }
</style>
</head>
<body>

<div id="loading" class="ring" role="status" aria-label="Loading"></div>
<p id="problem" class="msg" style="display:none"></p>

<form id="form" class="modal" novalidate>
  <div class="head">
    <div class="logo">T</div>
    <div><h1>Social Card Setup</h1><p>Connect your card to your link</p></div>
  </div>

  <label for="email">Email address</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

  <label for="password">Password (needed to change or delete later)</label>
  <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password">

  <label for="platform">Select platform</label>
  <select id="platform">
    <option value="">Choose one</option>
    <option>Google Review</option>
    <option>Instagram</option>
    <option>Facebook</option>
    <option>YouTube</option>
    <option>WhatsApp</option>
    <option>Website</option>
    <option>Phone number</option>
    <option>Other</option>
  </select>

  <label for="link">Link or number</label>
  <input id="link" type="text" placeholder="Paste your link or phone number" inputmode="url" autocapitalize="none">

  <div class="scan">
    <div><b>Scan QR code</b><span>Point your camera at a QR to fill the link</span></div>
    <button type="button" class="btn-small" id="scanBtn">Scan</button>
  </div>
  <div id="reader"></div>

  <div class="terms">
    <input type="checkbox" id="terms">
    <label for="terms" style="margin:0;font-weight:400">I agree to the Terms and Conditions and Privacy Policy</label>
  </div>

  <button class="submit" id="submitBtn" type="submit">Activate card</button>
</form>

<div id="success" class="modal">
  <div class="done">
    <div class="tick">✓</div>
    <h2>Card activated!</h2>
    <p>Your card is ready. From now on, every scan opens your link.</p>
    <a class="submit" id="openLink" href="#">Open my link</a>
  </div>
</div>

<div id="toast" role="alert"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ====== 1. PASTE YOUR TWO SUPABASE VALUES HERE ======
const SUPABASE_URL = "PASTE_PROJECT_URL_HERE";   // e.g. https://abcd1234.supabase.co
const SUPABASE_KEY = "PASTE_ANON_PUBLIC_KEY_HERE";
// ====================================================

const $ = id => document.getElementById(id);
const cardId = decodeURIComponent(location.search.replace(/^\?/, "").replace(/^id=/i, "")).trim();

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error("Server error " + r.status);
  return r.json();
}

function normalize(v) {
  v = v.trim();
  if (/^\+?[\d\s-]{7,}$/.test(v)) return "tel:" + v.replace(/[\s-]/g, "");
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) return "https://" + v;
  return v;
}

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(cardId + ":" + text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function toast(text, color) {
  const t = $("toast");
  t.textContent = text; t.style.background = color || "var(--red)"; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3500);
}

function problem(text) {
  $("loading").style.display = "none";
  $("problem").textContent = text; $("problem").style.display = "block";
}

async function start() {
  if (!cardId) return problem("Card ID is missing. Please scan your card again.");
  try {
    const link = await rpc("get_card_link", { card_id: cardId });
    if (link) { location.replace(link); return; }   // already activated: go straight to the link
    $("loading").style.display = "none";
    $("form").style.display = "block";
  } catch (e) {
    problem("Could not connect. Check your internet and scan again.");
  }
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim(), pass = $("password").value, platform = $("platform").value, link = $("link").value.trim();
  if (!email || !/^\S+@\S+\.\S+$/.test(email) || pass.length < 6 || !platform || !link || !$("terms").checked)
    return toast("Please fill all required fields");
  $("submitBtn").disabled = true;
  try {
    const finalLink = normalize(link);
    const ok = await rpc("activate_card", { card_id: cardId, p_email: email, p_hash: await sha256(pass), p_platform: platform, p_link: finalLink });
    if (!ok) { $("submitBtn").disabled = false; return toast("This card is already activated"); }
    $("form").style.display = "none";
    $("openLink").href = finalLink;
    $("success").style.display = "block";
  } catch (err) {
    $("submitBtn").disabled = false;
    toast("Something went wrong. Please try again.");
  }
});

// QR scanner
let scanner = null;
async function stopScan() {
  if (scanner) { try { await scanner.stop(); } catch (_) {} scanner = null; }
  $("reader").style.display = "none"; $("scanBtn").textContent = "Scan";
}
$("scanBtn").addEventListener("click", async () => {
  if (scanner) return stopScan();
  $("reader").style.display = "block"; $("scanBtn").textContent = "Stop";
  scanner = new Html5Qrcode("reader");
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, text => {
      $("link").value = text; stopScan(); toast("QR scanned", "var(--green)");
    });
  } catch (err) { stopScan(); toast("Camera not available. Allow camera permission."); }
});

start();
</script>
</body>
</html>
